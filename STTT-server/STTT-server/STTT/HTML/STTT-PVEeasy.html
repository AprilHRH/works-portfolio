<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Tic-Tac-Toe - 人机简单模式</title>
    <link rel="stylesheet" href="../CSS/STTT.css">
</head>
<body>
    <div class="container">
        <div class="game-container">
        <h1>Strategic Tic-Tac-Toe</h1>
        <h3>人机简单模式</h3>
        </div>
        
        <div class="game-layout">
            <div class="player-info-left">
                <div class="player-card player-x">
                    <div class="player-name">玩家 X</div>
                    <div class="player-symbol">X</div>
                    <div class="player-status">等待中</div>
                </div>
            </div>
            
            <div class="game-center">
                <div class="ai-status-info">
                    <div class="ai-thinking">
                        AI思考中: <span id="ai-thinking-status" class="no">否</span>
                    </div>
                </div>
                <div class="game-board" id="game-board"></div> 
                <div class="game-controls">
                    <button id="restart-button">重新开始</button>
                    <button id="select-difficulty">重选难度</button>
                    <button id="back-to-menu">返回菜单</button>
                </div>
            </div>
            
            <div class="player-info-right">
                <div class="player-card player-o">
                    <div class="player-name">电脑 O</div>
                    <div class="player-symbol">O</div>
                    <div class="player-status">等待中</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="game-result-modal" class="game-result-modal">
        <div class="modal-content">
            <h2 id="result-title">游戏结束！</h2>
            <p id="result-message">玩家 X 赢得了游戏！</p>
            <div class="modal-buttons">
                <button id="modal-restart">再来一局</button>
                <button id="modal-select-difficulty">重选难度</button>
                <button id="modal-back-menu">返回菜单</button>
            </div>
        </div>
    </div>
    
    <script src="../JS/STTT-PVEeasy.js"></script>
</body>
</html>
