<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Tic-Tac-Toe - 联机对战</title>
    <link rel="stylesheet" href="../CSS/STTT-PVE.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Strategic Tic-Tac-Toe</h1>
        <h3>联机对战</h3>
        
        <div id="connection-status" class="status-message">正在连接服务器...</div>
        
        <div id="game-mode-container" class="mode-container" style="display: none;">
            <div class="mode-selection">
                <h3>选择游戏模式</h3>
                <div class="mode-buttons">
                    <button id="create-room-btn" class="neumorphic-btn">创建房间</button>
                    <button id="random-match-btn" class="neumorphic-btn">随机匹配</button>
                    <button id="join-room-btn" class="neumorphic-btn">加入房间</button>
                </div>
            </div>
            <div class="navigation-buttons">
                <button id="back-to-home" class="neumorphic-btn">返回菜单</button>
            </div>
        </div>
        
        <div id="create-room-container" class="input-container" style="display: none;">
            <div class="input-section">
                <h3>创建房间</h3>
                <div class="input-group">
                    <label for="creator-name">输入你的名称:</label>
                    <input type="text" id="creator-name" placeholder="玩家名称" maxlength="20" class="neumorphic-input">
                </div>
            </div>
            <div class="navigation-buttons">
                <button id="back-from-create-room" class="neumorphic-btn">返回菜单</button>
                <button id="create-room-submit-btn" class="neumorphic-btn">创建房间</button>
            </div>
        </div>
        
        <div id="join-room-container" class="input-container" style="display: none;">
            <div class="input-section">
                <h3>加入房间</h3>
                <div class="input-group">
                    <label for="room-id">房间ID:</label>
                    <input type="text" id="room-id" placeholder="输入6位房间ID" maxlength="6" class="neumorphic-input">
                    <label for="joiner-name">输入你的名称:</label>
                    <input type="text" id="joiner-name" placeholder="玩家名称" maxlength="20" class="neumorphic-input">
                </div>
            </div>
            <div class="navigation-buttons">
                <button id="back-from-join-room" class="neumorphic-btn">返回菜单</button>
                <button id="join-room-submit-btn" class="neumorphic-btn">加入房间</button>
            </div>
        </div>
        
        <div id="random-match-container" class="input-container" style="display: none;">
            <div class="input-section">
                <h3>随机匹配</h3>
                <div class="input-group">
                    <label for="player-name">输入你的名称:</label>
                    <input type="text" id="player-name" placeholder="玩家名称" maxlength="20" class="neumorphic-input">
                </div>
            </div>
            <div class="navigation-buttons">
                <button id="back-from-random-match" class="neumorphic-btn">返回菜单</button>
                <button id="join-game-btn" class="neumorphic-btn">加入游戏</button>
            </div>
        </div>
        
        <div id="room-info-container" class="room-info" style="display: none;">
            <h3>房间创建成功</h3>
            <p>分享以下链接邀请朋友加入游戏:</p>
            <div class="room-link-container">
                <input type="text" id="room-link" readonly class="neumorphic-input">
                <button id="copy-link-btn" class="neumorphic-btn">复制链接</button>
            </div>
            <p>或分享房间ID: <span id="room-id-display" class="room-id"></span></p>
            <div class="loading-spinner"></div>
            <p>等待玩家加入...</p>
            <div class="navigation-buttons">
                <button id="back-from-room-info" class="neumorphic-btn">返回菜单</button>
            </div>
        </div>
        
        <div id="waiting-message" class="status-message" style="display: none;">
            <p>等待其他玩家加入...</p>
            <div class="loading-spinner"></div>
            <div class="navigation-buttons">
                <button id="back-from-waiting" class="neumorphic-btn">返回菜单</button>
            </div>
        </div>
        
        <div id="game-interface" class="game-layout" style="display: none;">
            <div class="player-info-left">
                <div class="player-card" id="player1-card">
                    <div class="player-name" id="player1-name">-</div>
                    <div class="player-symbol" id="player1-symbol">-</div>
                    <div class="player-status" id="player1-status">等待中</div>
                </div> 
            </div>
            
            <div class="game-center">
                <div class="current-turn-indicator">
                    <div class="turn-label">当前回合</div>
                    <div class="current-player"><span id="current-player">-</span></div>
                </div>
                
                <div class="game-board-container">
                    <div id="game-board" class="game-board"></div>
                </div>
                
                <div class="game-controls">
                    <button id="restart-button" style="display: none;">重新开始</button>
                    <button id="back-to-menu">返回菜单</button>
                </div>
            </div>
            
            <div class="player-info-right">
                <div class="player-card" id="player2-card">
                    <div class="player-name" id="player2-name">-</div>
                    <div class="player-symbol" id="player2-symbol">-</div>
                    <div class="player-status" id="player2-status">等待中</div>
                </div>
            </div>
        </div>
        
        <div id="game-result-modal" class="game-result-modal" style="display: none;">
            <div class="modal-content">
                <h2 id="result-title">游戏结束</h2>
                <p id="result-message"></p>
                <div class="modal-buttons">
                    <button id="modal-restart-btn">再来一局</button>
                    <button id="modal-close-btn">返回菜单</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/STTT-PVPOnline.js"></script>
</body>
</html>
